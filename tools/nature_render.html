<!DOCTYPE html><html><head><meta charset="utf-8"><title>render</title></head><body>
<script src="../src/25_nature.js"></script>
<script>
// render one sound offline and hand back 16-bit stereo WAV as base64
function wav(buf) {
  const n = buf.length, ch = 2, sr = buf.sampleRate, out = new DataView(new ArrayBuffer(44 + n * ch * 2));
  const w = (o, s) => { for (let i = 0; i < s.length; i++) out.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); out.setUint32(4, 36 + n * ch * 2, true); w(8, 'WAVE'); w(12, 'fmt '); out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, ch, true);
  out.setUint32(24, sr, true); out.setUint32(28, sr * ch * 2, true); out.setUint16(32, ch * 2, true); out.setUint16(34, 16, true); w(36, 'data'); out.setUint32(40, n * ch * 2, true);
  const L = buf.getChannelData(0), R = buf.numberOfChannels > 1 ? buf.getChannelData(1) : L; let o = 44, pk = 0;
  for (let i = 0; i < n; i++) { for (const v of [L[i], R[i]]) { const c = Math.max(-1, Math.min(1, v)); pk = Math.max(pk, Math.abs(c)); out.setInt16(o, c * 32767, true); o += 2; } }
  let bin = ''; const u8 = new Uint8Array(out.buffer); for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return { b64: btoa(bin), peak: pk };
}
// job: { kind: 'call'|'bed'|'old'|'amb', id, dist, secs, km, state, level }
window.render = async function (job) {
  const sr = 44100, oc = new OfflineAudioContext(2, Math.round(sr * job.secs), sr), N = PKNature.make(oc, oc.destination);
  if (job.levels) for (const k in job.levels) PKNature.LEVEL[k] = job.levels[k];
  N.user.coyote = { on: true };
  const step = 0.1;
  if (job.kind === 'call') N.call(job.id, { dist: job.dist, pan: 0, km: job.km });
  else if (job.kind === 'old') N.legacy(job.id);
  else {
    const tick = () => { if (job.kind === 'bed') N.bed(job.id).set(job.level == null ? 1 : job.level, job.params || {}); else N.amb.update(step, job.state); };
    tick();
    for (let t = step; t < job.secs - 0.05; t += step) oc.suspend(Math.round(t * 1000) / 1000).then(() => { tick(); oc.resume(); });
  }
  const buf = await oc.startRendering();
  return wav(buf);
};
window.ready = true;
</script></body></html>
